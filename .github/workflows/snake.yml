name: generate-snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ayush-srivas
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#764ba2&color_dots=#2d2d2d,#3a3a3a,#5a4a8a,#764ba2,#a370d8&color_dot_border=#00000000
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
